  />
  
  <!-- Base/Foundation -->
  <path
    d="M18 32 L46 32 L46 48 Q46 52 42 52 L22 52 Q18 52 18 48 Z"
    fill="rgba(123, 58, 237, 0.15)"
    stroke="url(#campusmentor-gradient)"
