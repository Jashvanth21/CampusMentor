<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="campusmentor-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#7C3AED" />
      <stop offset="100%" stopColor="#3B82F6" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="32" cy="32" r="32" fill="url(#campusmentor-gradient)" opacity="0.1"/>
  
  <!-- Main Shape - Book/Campus Style -->
  <path
    d="M16 20 L32 12 L48 20 L48 32 L32 40 L16 32 Z"
