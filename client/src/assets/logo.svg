    strokeLinecap="round"
    strokeLinejoin="round"
  />
  
  <!-- Window indicators (mentorship/communication) -->
  <rect x="24" y="36" width="6" height="6" fill="rgba(255,255,255,0.7)" rx="1"/>
  <rect x="34" y="36" width="6" height="6" fill="rgba(255,255,255,0.7)" rx="1"/>
  
  <!-- Center dot (core) -->
  <circle cx="32" cy="28" r="1.5" fill="rgba(255,255,255,0.8)"/>
